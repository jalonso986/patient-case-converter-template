<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Virtual Patient Card</title>
  <meta property="og:title" content="Carla, tu sonrisa empieza aquí" />
  <meta property="og:description" content="Tu plan de tratamiento personalizado, explicado paso a paso." />
  <meta property="og:type" content="website" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; background:#f4f4f4; font-family: Arial, Helvetica, sans-serif; display:flex; justify-content:center; overscroll-behavior:none; }
    .app { width:100%; max-width:414px; min-height:100vh; background:#fff; position:relative; overflow-x:hidden; }
    .screen { display:none; position:relative; width:100%; min-height:100vh; background:#fff; }
    .screen.active { display:block; }
    .back { position:fixed; top:10px; left:calc(50% - 197px); z-index:100; background:rgba(255,255,255,.96); border:1px solid #ddd; border-radius:18px; padding:7px 12px; font-size:14px; color:#111; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.08); }
    @media (max-width:414px){ .back{ left:10px; } }
    .home { padding:22px 12px 20px; }
    .patient-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
    .patient-left { display:flex; align-items:center; gap:12px; min-width:0; }
    .patient-photo, .patient-photo-crop { width:64px; height:64px; border-radius:50%; background:#eee; flex:0 0 auto; overflow:hidden; }
    .patient-photo { object-fit:cover; }
    .patient-photo-crop { background-image: var(--patient-photo); background-size:414px auto; background-position:-24px -22px; background-repeat:no-repeat; }
    .patient-name { font-size:18px; font-weight:700; line-height:1.05; }
    .patient-age { font-size:14px; margin-top:4px; }
    .patient-status { font-size:12px; color:#00856f; font-weight:700; margin-top:4px; }
    .clinic-logo { width:72px; height:72px; object-fit:contain; }
    .summary-card { display:grid; grid-template-columns:1fr 1px 1fr; gap:16px; background:#eaf7fc; border-radius:20px; padding:18px; margin-bottom:12px; }
    .divider { background:#aac1c8; width:1px; }
    .label { font-size:13px; font-weight:700; color:#0a2b4d; margin-bottom:8px; }
    .amount { font-size:31px; font-weight:800; color:#00967f; letter-spacing:-1px; }
    .finance { font-size:11px; color:#0a2b4d; margin-top:12px; line-height:1.2; }
    .cta { display:flex; align-items:center; justify-content:space-between; padding:8px 0; font-size:13px; color:#0a2b4d; cursor:pointer; }
    .cta-icon { width:30px; height:30px; border-radius:50%; background:#c8f5ef; display:inline-flex; align-items:center; justify-content:center; margin-right:9px; color:#00967f; font-weight:700; }
    .odontogram { border:1px solid #ccc; border-radius:8px; overflow:hidden; margin:12px 0; background:#fff; }
    .odontogram img { width:100%; display:block; }
    .odontogram-crop { height:226px; background-image:var(--odontogram-image); background-size:414px auto; background-position:0 -137px; background-repeat:no-repeat; }
    .caption { text-align:center; color:#0a2b4d; font-size:10px; margin-top:-16px; padding-bottom:8px; position:relative; z-index:1; }
    .section-title { display:flex; justify-content:space-between; align-items:center; font-size:14px; color:#0a2b4d; margin:12px 4px 6px; letter-spacing:.3px; }
    .mini-list { border:1px solid #ccc; border-radius:8px; overflow:hidden; }
    .mini-item { display:grid; grid-template-columns:54px 1fr 78px 18px; gap:8px; align-items:center; padding:8px 8px; border-bottom:1px solid #ddd; cursor:pointer; }
    .mini-item:last-child { border-bottom:0; }
    .mini-item.warning { background:#ffe9bd; }
    .icon { width:46px; height:46px; border-radius:50%; object-fit:cover; object-position:center; border:1px solid #222; background:#fff; display:block; }
    .mini-title { font-size:14px; font-weight:700; line-height:1.05; }
    .mini-desc { margin-top:4px; font-size:11px; line-height:1.15; color:#0a2b4d; }
    .warning .mini-desc { color:#f06f2c; }
    .mini-price { font-size:13px; font-weight:700; text-align:right; white-space:nowrap; }
    #breakdown.active { display:flex; flex-direction:column; height:100vh; overflow:hidden; background:#fff; }
    .bd-top { flex:0 0 auto; padding:22px 12px 10px; background:#fff; border-bottom:1px solid #ddd; }
    .bd-column-header { display:grid; grid-template-columns:64px 104px 34px 62px 54px 58px 18px; padding:4px 8px; border-bottom:1px solid #cfcfcf; color:#555; font-size:13px; flex:0 0 auto; }
    .bd-column-header .concepto { grid-column:1 / span 2; padding-left:12px; text-align:left; }
    .bd-column-header div { text-align:right; white-space:nowrap; }
    .bd-column-header .pieza { text-align:center; }
    .bd-list { flex:1 1 auto; overflow-y:auto; overflow-x:hidden; padding:0 8px 20px 8px; background:#fff; }
    .item { display:grid; grid-template-columns:64px 104px 34px 62px 54px 58px 18px; align-items:center; min-height:78px; border-bottom:1px solid #cfcfcf; background:#fff; cursor:pointer; column-gap:0; }
    .item.warning { background:#ffe9bd; border-radius:8px; margin:5px 0; border-bottom:none; }
    .bd-icon { width:46px; height:46px; border-radius:50%; object-fit:cover; object-position:center; border:1px solid #222; margin-left:14px; display:block; background:#fff; }
    .name { font-size:13.5px; font-weight:700; line-height:1.08; color:#222; }
    .desc { font-size:10.5px; line-height:1.15; color:#0a2b4d; margin-top:4px; }
    .warning .desc { color:#f06f2c; }
    .badge { display:inline-block; background:#ffd993; color:#f08a00; font-size:8px; font-weight:700; padding:2px 6px; border-radius:8px; margin-bottom:3px; }
    .cell { font-size:13.5px; color:#222; text-align:right; white-space:nowrap; }
    .piece { text-align:center; }
    .total { font-size:13.5px; font-weight:700; text-align:right; white-space:nowrap; color:#222; }
    .chev { font-size:22px; color:#222; text-align:center; }
    .screen-img { width:100%; display:block; }
    .detail-view { display:none; position:fixed; inset:0; background:#fff; z-index:80; overflow:auto; touch-action:pan-x pan-y pinch-zoom; }
    .detail-view.active { display:block; }
    .detail-img { width:100%; max-width:none; display:block; margin-top:50px; }
  </style>
</head>
<body>
  <div class="app">
    <section id="home" class="screen active"><div class="home" id="homeContent"></div></section>
    <section id="breakdown" class="screen">
      <button class="back" onclick="goBack()">← Volver</button>
      <div class="bd-top" id="breakdownTop"></div>
      <div class="bd-column-header"><div class="concepto">Concepto</div><div class="pieza">Pieza</div><div>Importe</div><div>Desc.</div><div>Total</div><div></div></div>
      <div class="bd-list" id="treatmentList"></div>
    </section>
    <section id="timeline" class="screen"><button class="back" onclick="goBack()">← Volver</button><img class="screen-img" id="timelineImg" src="" /></section>
  </div>
  <div id="detail" class="detail-view"><button class="back" onclick="goBack()">← Volver</button><img id="detail-img" class="detail-img" src="" /></div>
  <script src="data.js"></script>
  <script>
    let currentScreen = 'home';
    history.replaceState({ screen: 'home' }, '');
    const $ = (id) => document.getElementById(id);
    function money(v){ return v || ''; }
    function treatmentLines(title){ return String(title).replace(' ', '<br>'); }
    function renderPatientPhoto(p){ return p.photoCrop ? `<div class="patient-photo-crop" style="--patient-photo:url('${p.photo}')"></div>` : `<img class="patient-photo" src="${p.photo}"/>`; }
    function renderOdontogram(od){ return od.crop ? `<div class="odontogram odontogram-crop" style="--odontogram-image:url('${od.image}')"></div>` : `<div class="odontogram"><img src="${od.image}"/></div>`; }
    function renderHeader(){
      const p = patientData.patient;
      return `<div class="patient-header"><div class="patient-left">${renderPatientPhoto(p)}<div><div class="patient-name">${p.name}</div><div class="patient-age">${p.age}</div><div class="patient-status">● ${p.status}</div></div></div><img class="clinic-logo" src="${p.logo}"/></div>`;
    }
    function renderHome(){
      const f = patientData.financial;
      const od = patientData.odontogram;
      const priority = patientData.treatments.filter(t => patientData.summaryTreatments.includes(t.title)).slice(0,3);
      $('homeContent').innerHTML = `${renderHeader()}<div class="summary-card"><div><div class="label">Inversión total</div><div class="amount">${f.total}</div><div class="finance">${f.financingAvailable ? '● Financiación disponible<br><br>' : ''}Desde <b>${f.monthly}</b><br>${f.monthlyNote}</div></div><div class="divider"></div><div><div class="cta" onclick="window.open('https://wa.me/','_blank')"><span><span class="cta-icon">☏</span>Resolver dudas por WhatsApp</span><b>›</b></div><div class="cta" onclick="showScreen('timeline')"><span><span class="cta-icon">▦</span>Ver plan paso a paso</span><b>›</b></div><div class="cta" onclick="showScreen('breakdown')"><span><span class="cta-icon">€</span>Ver coste desglosado</span><b>›</b></div></div></div>${renderOdontogram(od)}<div class="caption">● ${od.caption}</div><div class="section-title"><span>PLAN TRATAMIENTO</span><span onclick="showScreen('breakdown')" style="cursor:pointer">Ver desglose completo ↗</span></div><div class="mini-list">${priority.map(t => `<div class="mini-item ${t.warning ? 'warning' : ''}" onclick="openDetail('${t.explanation}')"><img class="icon" src="${t.icon}"/><div><div class="mini-title">${t.title}</div><div class="mini-desc">${t.description}</div></div><div class="mini-price">${t.total}</div><div>›</div></div>`).join('')}</div><div class="section-title"><span>TU PLAN EN VARIAS FASES</span><span onclick="showScreen('timeline')" style="cursor:pointer">Ver plan completo ↗</span></div><img class="screen-img" src="${patientData.timeline.image}"/>`;
    }
    function renderBreakdown(){
      $('breakdownTop').innerHTML = renderHeader() + `${renderOdontogram(patientData.odontogram)}<div class="caption">● ${patientData.odontogram.caption}</div>`;
      $('treatmentList').innerHTML = patientData.treatments.map(t => `<div class="item ${t.warning ? 'warning' : ''}" onclick="openDetail('${t.explanation}')"><img class="bd-icon" src="${t.icon}"/><div>${t.warning ? '<div class="badge">⚠ ATENCIÓN</div>' : ''}<div class="name">${treatmentLines(t.title)}</div><div class="desc">${t.description}</div></div><div class="cell piece">${t.piece || ''}</div><div class="cell">${money(t.price)}</div><div class="cell">${money(t.discount)}</div><div class="total">${money(t.total)}</div><div class="chev">›</div></div>`).join('');
      $('timelineImg').src = patientData.timeline.image;
    }
    function showScreen(id, push = true){ document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); closeDetail(false); currentScreen = id; window.scrollTo(0,0); if(push) history.pushState({screen:id}, ''); }
    function openDetail(src, push = true){ $('detail-img').src = src; $('detail').classList.add('active'); if(push) history.pushState({screen:currentScreen, detail:src}, ''); }
    function closeDetail(clear = true){ $('detail').classList.remove('active'); if(clear) $('detail-img').src = ''; }
    function goBack(){ history.back(); }
    window.addEventListener('popstate', function(event){ const state = event.state || {screen:'home'}; if(state.detail){ showScreen(state.screen, false); openDetail(state.detail, false); return; } closeDetail(); showScreen(state.screen || 'home', false); });
    renderHome(); renderBreakdown();
  </script>
</body>
</html>
