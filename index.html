<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Virtual Patient Card</title>
  <meta property="og:title" content="Tu plan de tratamiento | Araújo Smart Dental">
  <meta property="og:description" content="Tu plan personalizado, explicado paso a paso.">
  <meta property="og:image" content="https://jalonso986.github.io/patient-case-converter-template/assets/og-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jalonso986.github.io/patient-case-converter-template/">
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:image" content="https://jalonso986.github.io/patient-case-converter-template/assets/og-preview.png">
  <style>
    * { box-sizing: border-box; }
    html { margin:0; padding:0; background:#f4f4f4; font-family: Arial, Helvetica, sans-serif; overscroll-behavior:none; }
    body { margin:0; padding:0; background:#f4f4f4; font-family: Arial, Helvetica, sans-serif; overscroll-behavior:none; }
    .app { width:100%; max-width:414px; min-height:100vh; background:#fff; position:relative; overflow-x:hidden; margin:0 auto; }
    .screen { display:none; position:relative; width:100%; min-height:100vh; background:#fff; }
    .screen.active { display:block; }
#timeline.screen.active { min-height:auto; }
    .back { position:fixed; top:10px; left:calc(50% - 197px); z-index:100; background:rgba(255,255,255,.96); border:1px solid #ddd; border-radius:18px; padding:7px 12px; font-size:14px; color:#111; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.08); }
    @media (max-width:414px){ .back{ left:10px; } }
    .home { padding:22px 12px 20px; }
    .patient-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
    .patient-left { display:flex; align-items:center; gap:12px; min-width:0; }
    .patient-photo, .patient-photo-crop { width:64px; height:64px; border-radius:50%; background:#eee; flex:0 0 auto; overflow:hidden; }
    .patient-photo { object-fit:cover; }
    .patient-photo-crop { background-image: var(--patient-photo); background-size:414px auto; background-position:-24px -22px; background-repeat:no-repeat; }
    .patient-name { font-size:18px; font-weight:700; line-height:1.05; }
    .patient-age { font-size:14px; margin-top:4px; }
    .patient-status { font-size:12px; color:#00856f; font-weight:700; margin-top:4px; }
    .clinic-logo { width:72px; height:72px; object-fit:contain; }
    .summary-card { display:grid; grid-template-columns:minmax(0,1.08fr) 1px minmax(0,.92fr); gap:12px; background:#eaf7fc; border-radius:20px; padding:18px 14px; margin-bottom:12px; align-items:stretch; }
    .summary-main, .summary-actions { min-width:0; }
    .divider { background:#aac1c8; width:1px; }
    .label { font-size:13px; font-weight:700; color:#0a2b4d; margin-bottom:8px; }
    .amount { display:block; width:100%; white-space:nowrap; overflow:visible; font-size:32px; line-height:1; font-weight:800; color:#00967f; letter-spacing:-1px; }
    .finance { font-size:11px; color:#0a2b4d; margin-top:12px; line-height:1.25; }
    .cta { display:grid; grid-template-columns:38px minmax(0,1fr) 12px; column-gap:9px; align-items:center; padding:8px 0; color:#0a2b4d; cursor:pointer; min-height:50px; }
    .cta + .cta { border-top:1px solid rgba(10,43,77,.08); }
    .cta-icon { width:38px; height:38px; border-radius:50%; background:#c8f5ef; display:inline-flex; align-items:center; justify-content:center; color:#00967f; font-weight:800; font-size:18px; line-height:1; }
    .cta-copy { display:block; font-size:12.5px; line-height:1.15; font-weight:500; letter-spacing:-.1px; }
    .cta-arrow { font-size:18px; line-height:1; text-align:right; font-weight:700; color:#0a2b4d; }
    .odontogram { overflow:hidden; margin:12px 0; background:#fff; }
    .odontogram img { width:100%; display:block; margin:0 auto; }
    .odontogram-crop { height:238px; border:0; border-radius:8px; background-image:var(--odontogram-image); background-size:100% auto; background-position:center -132px; background-repeat:no-repeat; }
    .timeline-crop { width:100%; height:360px; background-image:var(--timeline-image); background-size:100% auto; background-position:center -204px; background-repeat:no-repeat; margin-top:4px; }
    .timeline-full { padding-top:48px; }
    .section-title { display:flex; justify-content:space-between; align-items:center; font-size:14px; color:#0a2b4d; margin:12px 4px 6px; letter-spacing:.3px; }
    .mini-list { border:1px solid #ccc; border-radius:8px; overflow:hidden; }
    .mini-item { display:grid; grid-template-columns:54px 1fr 78px 18px; gap:8px; align-items:center; padding:8px 8px; border-bottom:1px solid #ddd; cursor:pointer; }
    .mini-item:last-child { border-bottom:0; }
    .mini-item.warning { background:#ffe9bd; }
    .icon { width:46px; height:46px; border-radius:50%; object-fit:cover; object-position:center; border:1px solid #222; background:#fff; display:block; }
    .mini-title { font-size:14px; font-weight:700; line-height:1.05; }
    .mini-desc { margin-top:4px; font-size:11px; line-height:1.15; color:#0a2b4d; }
    .warning .mini-desc { color:#f06f2c; }
    .mini-price { font-size:13px; font-weight:700; text-align:right; white-space:nowrap; }
    #breakdown.active { display:flex; flex-direction:column; height:100vh; overflow:hidden; background:#fff; }
    .bd-top { flex:0 0 auto; padding:22px 12px 10px; background:#fff; border-bottom:1px solid #ddd; }
    .bd-column-header { display:grid; grid-template-columns:54px minmax(96px,1fr) 28px 56px 48px 58px 14px; padding:4px 14px; border-bottom:1px solid #cfcfcf; color:#555; font-size:13px; flex:0 0 auto; }
    .bd-column-header .concepto { grid-column:1 / span 2; padding-left:0; text-align:left; }
    .bd-column-header div { text-align:right; white-space:nowrap; }
    .bd-column-header .pieza { text-align:center; }
    .bd-list { flex:1 1 auto; overflow-y:auto; overflow-x:hidden; padding:0 14px 24px; background:#fff; }
    .item { display:grid; grid-template-columns:54px minmax(96px,1fr) 28px 56px 48px 58px 14px; align-items:center; min-height:78px; border-bottom:1px solid #cfcfcf; background:#fff; cursor:pointer; column-gap:0; }
    .item.warning { background:#ffe9bd; border-radius:8px; margin:5px 0; border-bottom:none; }
    .bd-icon { width:46px; height:46px; border-radius:50%; object-fit:cover; object-position:center; border:1px solid #222; margin-left:0; display:block; background:#fff; }
    .name { font-size:13.5px; font-weight:700; line-height:1.08; color:#222; }
    .desc { font-size:10.5px; line-height:1.15; color:#0a2b4d; margin-top:4px; }
    .warning .desc { color:#f06f2c; }
    .badge { display:inline-block; background:#ffd993; color:#f08a00; font-size:8px; font-weight:700; padding:2px 6px; border-radius:8px; margin-bottom:3px; }
    .cell { font-size:13.5px; color:#222; text-align:right; white-space:nowrap; }
    .piece { text-align:center; }
    .total { font-size:13.5px; font-weight:700; text-align:right; white-space:nowrap; color:#222; }
    .chev { font-size:22px; color:#222; text-align:center; }
    .breakdown-total-card { margin:18px 0 26px; padding:18px 16px; border:1px solid #e2e6e8; border-radius:18px; background:#fff; box-shadow:0 8px 24px rgba(0,0,0,.08); text-align:center; }
    .breakdown-total-row { display:flex; align-items:baseline; justify-content:center; gap:16px; flex-wrap:wrap; }
    .breakdown-total-label { font-size:18px; color:#0a2b4d; }
    .breakdown-total-amount { font-size:28px; line-height:1; font-weight:800; color:#00756f; white-space:nowrap; letter-spacing:-.5px; }
    .breakdown-total-finance { margin-top:10px; font-size:18px; line-height:1.2; color:#00856f; font-weight:600; }
    .screen-img { width:100%; display:block; }
    .detail-view { display:none; position:fixed; inset:0; background:#fff; z-index:80; overflow:auto; touch-action:pan-x pan-y pinch-zoom; }
    .detail-view.active { display:block; }
    .detail-img { width:100%; max-width:none; display:block; margin-top:50px; }
  </style>
</head>
<body>
  <div class="app">
    <section id="home" class="screen active"><div class="home" id="homeContent"></div></section>
    <section id="breakdown" class="screen">
      <button class="back" onclick="goBack()">← Volver</button>
      <div class="bd-top" id="breakdownTop"></div>
      <div class="bd-column-header"><div class="concepto">Concepto</div><div class="pieza">Pieza</div><div>Importe</div><div>Desc.</div><div>Total</div><div></div></div>
      <div class="bd-list" id="treatmentList"></div>
    </section>
    <section id="timeline" class="screen"><button class="back" onclick="goBack()">← Volver</button><div id="timelineScreenContent"></div></section>
  </div>
  <div id="detail" class="detail-view"><button class="back" onclick="goBack()">← Volver</button><img id="detail-img" class="detail-img" src="" /></div>
  <script src="data.js"></script>
  <script src="timeline-fix.js"></script>
  <script>
    let currentScreen = 'home';
    history.replaceState({ screen: 'home' }, '');
    const $ = (id) => document.getElementById(id);
    function money(v){ return v || ''; }
    function normalizeCurrency(v){ return String(v || '').replace(/\s+€/g, '€'); }
    function treatmentLines(title){ return String(title).replace(' ', '<br>'); }
    function parseTotal(str){ return parseFloat(String(str).replace(/\./g,'').replace(',','.')); }
    function renderPatientPhoto(p){ if(!p.photo) return '<div class="patient-photo" style="background:#e8e8e8;"></div>'; if(p.photoCrop) return `<div class="patient-photo-crop" style="background-image:url('${p.photo}')"></div>`; return `<img class="patient-photo" src="${p.photo}"/>`; }
    function renderOdontogram(od){ if(!od.image) return ''; return od.crop ? `<div class="odontogram odontogram-crop" style="--odontogram-image:url('${od.image}')"></div>` : `<div class="odontogram"><img src="${od.image}"/></div>`; }
    function getTitleForPhase(phase) {
      if (phase.title) return phase.title;
      var first = phase.items && phase.items[0];
      if (!first) return '';
      var text = typeof first === 'string' ? first : first.text;
      return text.length > 20 ? text.slice(0, 20) + '…' : text;
    }
    function renderTimeline(tl) {
      if (!tl.phases || !tl.phases.length) {
        return tl.crop ? '<div class="timeline-crop" style="--timeline-image:url(\'' + tl.image + '\')"></div>' : '<img class="screen-img" src="' + tl.image + '"/>';
      }
      var cards = tl.phases.map(function(ph, i) {
        var title = getTitleForPhase(ph);
        var items = ph.items.map(function(it) {
          return typeof it === 'string' ? it : it.text;
        }).join(' · ');
        return '<div style="min-width:160px;max-width:160px;border:1px solid #e8e8e8;border-radius:12px;padding:14px 12px;flex-shrink:0;position:relative;display:flex;flex-direction:column;">' +
          '<div style="width:28px;height:28px;border-radius:50%;background:#2a7c6f;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;">' + (i + 1) + '</div>' +
          '<div style="font-size:12px;font-weight:700;color:#1a1a1a;margin-top:10px;margin-bottom:6px;">' + title + '</div>' +
          '<div style="font-size:11px;color:#666;line-height:1.4;margin-bottom:10px;">' + items + '</div>' +
          '<div style="font-size:12px;font-weight:600;color:#2a7c6f;margin-top:auto;">' + ph.date + '</div>' +
          '</div>';
      }).join('');
      return '<style>.tl-hstrip::-webkit-scrollbar{display:none}</style>' +
        '<div style="background:#fff;border-radius:16px;border:1px solid #ebebeb;padding:16px;margin-bottom:12px;">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;">' +
        '<span style="font-size:13px;font-weight:700;color:#1a1a1a;">TU PLAN EN VARIAS FASES</span>' +
        '<span onclick="showScreen(\'timeline\')" style="font-size:13px;font-weight:600;color:#2a7c6f;text-decoration:none;cursor:pointer;">Ver plan completo ↗</span>' +
        '</div>' +
        '<div style="position:relative;margin-top:14px;">' +
        '<div style="position:absolute;top:28px;left:26px;right:26px;height:2px;background:#e0e0e0;z-index:0;"></div>' +
        '<div class="tl-hstrip" style="display:flex;overflow-x:auto;max-width:100%;gap:12px;padding-bottom:8px;scrollbar-width:none;-ms-overflow-style:none;">' +
        cards +
        '</div>' +
        '</div>' +
        '</div>';
    }
    function renderTimelineFull(tl){
      if(!tl.phases||!tl.phases.length){
        return '<div class="timeline-full"><div style="padding:0 12px;">'+renderHeader()+'</div><img class="screen-img" src="'+tl.image+'" alt="Plan completo"/></div>';
      }
      var phases=tl.phases.map(function(ph,i){
        var mb=i===tl.phases.length-1?'0':'14px';
        var items=ph.items.map(function(it){
          var t=typeof it==='string'?it:it.text;
          return '<div style="font-size:13px;color:#333;padding:2px 0;line-height:1.5;">'+t+'</div>';
        }).join('');
        return '<div class="tl-phase" style="position:relative;margin-bottom:'+mb+';">'+
          '<div class="tl-dot" style="position:absolute;left:-24px;top:14px;width:16px;height:16px;border-radius:50%;background:#2a7c6f;z-index:1;"></div>'+
          '<div style="background:#FAFAFA;border:1px solid #F0F0F0;box-shadow:0 2px 10px rgba(0,0,0,.06);border-radius:10px;padding:14px 16px;">'+
          '<div style="font-size:14px;font-weight:700;color:#2a7c6f;margin-bottom:5px;">'+ph.date+'</div>'+
          '<div style="font-size:12px;font-style:italic;color:#777;margin-bottom:8px;line-height:1.5;">'+ph.emotion+'</div>'+
          items+'</div></div>';
      }).join('');
      return '<div class="timeline-full">'+
        '<div style="padding:0 12px 16px;">'+renderHeader()+'</div>'+
        '<div style="padding:0 20px 40px;">'+
        '<h2 style="font-size:17px;font-weight:700;color:#1a1a1a;margin:0 0 6px;">TU PLAN FECHA A FECHA</h2>'+
        '<p style="font-size:13px;color:#555;margin:0 0 20px;line-height:1.5;">Si empiezas el <span style="color:#2a7c6f;font-weight:600;">'+tl.startDate+'</span>, '+tl.intro+'</p>'+
        '<div style="position:relative;padding-left:28px;">'+
        '<div class="tl-line" style="position:absolute;left:11px;top:0;width:2px;height:0;background:#d8d8d8;"></div>'+
        phases+'</div></div></div>';
    }
    function renderHeader(){
      const p = patientData.patient;
      return `<div class="patient-header"><div class="patient-left">${renderPatientPhoto(p)}<div><div class="patient-name">${p.name}</div><div class="patient-age">${p.age}</div><div class="patient-status">● ${p.status}</div></div></div><img class="clinic-logo" src="${p.logo}"/></div>`;
    }
    function renderCta(icon, label, action){
      return `<div class="cta" onclick="${action}"><span class="cta-icon">${icon}</span><span class="cta-copy">${label}</span><span class="cta-arrow">›</span></div>`;
    }
    function renderBreakdownTotal(){
      const f = patientData.financial;
      return `<div class="breakdown-total-card"><div class="breakdown-total-row"><div class="breakdown-total-label">Inversión total del plan</div><div class="breakdown-total-amount">${normalizeCurrency(f.total)}</div></div><div class="breakdown-total-finance">Financiable desde ${f.monthly}</div></div>`;
    }
    function adjustAmountSize(){
      document.querySelectorAll('.amount').forEach(el => {
        const parent = el.parentElement;
        if(!parent) return;
        let size = 34;
        el.style.fontSize = size + 'px';
        const maxWidth = parent.clientWidth;
        while(el.scrollWidth > maxWidth && size > 21){
          size -= 1;
          el.style.fontSize = size + 'px';
        }
      });
    }
    function renderHome(){
      const f = patientData.financial;
      const od = patientData.odontogram;
      const warnings = patientData.treatments.filter(t => t.warning);
      const nonWarnings = patientData.treatments.filter(t => !t.warning).sort((a,b) => parseTotal(b.total) - parseTotal(a.total));
      const priority = [...warnings, ...nonWarnings].slice(0, 3);
      $('homeContent').innerHTML = `${renderHeader()}<div class="summary-card"><div class="summary-main"><div class="label">Inversión total</div><div class="amount">${normalizeCurrency(f.total)}</div><div class="finance">${f.financingAvailable ? '● Financiación disponible<br><br>' : ''}Desde <b>${f.monthly}</b><br>${f.monthlyNote}</div></div><div class="divider"></div><div class="summary-actions">${renderCta('☏','Resolver dudas<br>por WhatsApp',"window.open('https://wa.me/','_blank')")}${renderCta('▦','Ver plan paso a<br>paso',"showScreen('timeline')")}${renderCta('€','Ver coste<br>desglosado',"showScreen('breakdown')")}</div></div>${renderOdontogram(od)}<div class="section-title"><span>PLAN TRATAMIENTO</span><span onclick="showScreen('breakdown')" style="font-size:13px;font-weight:600;color:#2a7c6f;text-decoration:none;cursor:pointer;">Ver desglose completo ↗</span></div><div class="mini-list">${priority.map(t => `<div class="mini-item ${t.warning ? 'warning' : ''}" onclick="openDetail('${t.explanation}')">${t.icon ? `<img class="icon" src="${t.icon}"/>` : '<div class="icon" style="background:#eee;"></div>'}<div><div class="mini-title">${t.title}</div><div class="mini-desc">${t.description}</div></div><div class="mini-price">${t.total}</div><div>›</div></div>`).join('')}</div>${renderTimeline(patientData.timeline)}`;
      requestAnimationFrame(adjustAmountSize);
    }
    function renderBreakdown(){
      $('breakdownTop').innerHTML = renderHeader() + `${renderOdontogram(patientData.odontogram)}`;
      $('treatmentList').innerHTML = patientData.treatments.map(t => `<div class="item ${t.warning ? 'warning' : ''}" onclick="openDetail('${t.explanation}')">${t.icon ? `<img class="bd-icon" src="${t.icon}"/>` : '<div class="bd-icon" style="background:#eee;"></div>'}<div>${t.warning ? '<div class="badge">⚠ ATENCIÓN</div>' : ''}<div class="name">${treatmentLines(t.title)}</div><div class="desc">${t.description}</div></div><div class="cell piece">${t.piece || ''}</div><div class="cell">${money(t.price)}</div><div class="cell">${money(t.discount)}</div><div class="total">${money(t.total)}</div><div class="chev">›</div></div>`).join('') + renderBreakdownTotal();
      $('timelineScreenContent').innerHTML = renderTimelineFull(patientData.timeline);
    }
    function fixTimelineLine(){
      var line=document.querySelector('#timelineScreenContent .tl-line');
      var dots=document.querySelectorAll('#timelineScreenContent .tl-dot');
      if(!line||dots.length<2)return;
      var cTop=line.parentElement.getBoundingClientRect().top;
      var fTop=dots[0].getBoundingClientRect().top+8;
      var lTop=dots[dots.length-1].getBoundingClientRect().top+8;
      line.style.top=(fTop-cTop)+'px';
      line.style.height=Math.max(0,lTop-fTop)+'px';
    }
    function showScreen(id, push = true){ document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); closeDetail(false); currentScreen = id; window.scrollTo(0,0); if(id==='timeline') requestAnimationFrame(fixTimelineLine); if(push) history.pushState({screen:id}, ''); 
  document.querySelector('.app').style.minHeight = (id==='timeline') ? 'auto' : '';}
    function openDetail(src, push = true){ if(!src) return; $('detail-img').src = src; $('detail').classList.add('active'); if(push) history.pushState({screen:currentScreen, detail:src}, ''); }
    function closeDetail(clear = true){ $('detail').classList.remove('active'); if(clear) $('detail-img').src = ''; }
    function goBack(){ history.back(); }
    window.addEventListener('popstate', function(event){ const state = event.state || {screen:'home'}; if(state.detail){ showScreen(state.screen, false); openDetail(state.detail, false); return; } closeDetail(); showScreen(state.screen || 'home', false); });
    window.addEventListener('resize', adjustAmountSize);
    renderHome(); renderBreakdown();
  </script>
</body>
</html>
