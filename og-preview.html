<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #ffffff;
      font-family: 'DM Sans', Arial, sans-serif;
      position: relative;
    }
    .main-row {
      display: flex;
      width: 1200px;
      height: 420px;
    }
    .left-panel {
      width: 717px;
      flex-shrink: 0;
      padding: 44px 52px 36px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      position: relative;
    }
    .top-row {
      display: flex;
      align-items: flex-start;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #e0f2ee;
      color: #1a6b5a;
      font-size: 14px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 100px;
      white-space: nowrap;
      font-family: 'DM Sans', Arial, sans-serif;
    }
    .badge img {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }
    #logo {
      position: absolute;
      top: 44px;
      right: 52px;
      width: auto;
      height: 90px;
      object-fit: contain;
    }
    .headline {
      margin-top: 20px;
      position: relative;
      z-index: 1;
    }
    #patient-name {
      font-size: 96px;
      font-weight: 900;
      color: #0d1f3c;
      line-height: 1;
      display: block;
      font-family: 'DM Sans', Arial, sans-serif;
    }
    .tagline {
      font-size: 76px;
      font-weight: 900;
      color: #2a7c6f;
      line-height: 1.05;
      display: block;
      font-family: 'DM Sans', Arial, sans-serif;
    }
    .right-panel {
      width: 483px;
      flex-shrink: 0;
      overflow: hidden;
      background: #f0f4f3;
    }
    #patient-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: none;
    }
    #photo-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #e0f2ee, #c8e8e2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 100px;
      color: #2a7c6f;
      opacity: 0.3;
    }
    .icons-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 210px;
      background: #ffffff;
      border-top: 1px solid #efefef;
      display: flex;
      align-items: center;
      padding: 0 80px;
    }
    .icon-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .icon-item.sep {
      border-right: 1px solid #e8e8e8;
    }
    .icon-circle {
      width: 100px;
      height: 100px;
      background: #e0f2ee;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-circle img {
      width: 56px;
      height: 56px;
      object-fit: contain;
      filter: invert(40%) sepia(80%) saturate(600%) hue-rotate(120deg) brightness(90%);
    }
    .icon-label {
      font-size: 18px;
      font-weight: 600;
      color: #333;
      text-align: center;
      white-space: pre-line;
      font-family: 'DM Sans', Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div class="main-row">
    <div class="left-panel">
      <div class="top-row">
        <span class="badge">
          <img id="icon-badge-calendar" src="" alt="" />
          DÍA 0 – TU PLAN ESTÁ LISTO
        </span>
      </div>
      <img id="logo" src="" alt="Araújo" />
      <div class="headline">
        <span id="patient-name"></span>
        <span class="tagline">tu sonrisa empieza aquí</span>
      </div>
    </div>
    <div class="right-panel">
      <img id="patient-photo" src="" alt="" />
      <div id="photo-placeholder">👤</div>
    </div>
  </div>

  <div class="icons-bar">
    <div class="icon-item sep">
      <div class="icon-circle"><img id="icon-calendar" src="" alt="" /></div>
      <span class="icon-label">Plan paso&#10;a paso</span>
    </div>
    <div class="icon-item sep">
      <div class="icon-circle"><img id="icon-implant" src="" alt="" /></div>
      <span class="icon-label">Tratamiento&#10;explicado</span>
    </div>
    <div class="icon-item sep">
      <div class="icon-circle"><img id="icon-euro" src="" alt="" /></div>
      <span class="icon-label">Coste&#10;desglosado</span>
    </div>
    <div class="icon-item">
      <div class="icon-circle"><img id="icon-shield" src="" alt="" /></div>
      <span class="icon-label">Resultados&#10;esperados</span>
    </div>
  </div>
</body>
</html>
