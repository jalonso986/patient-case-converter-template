<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      position: relative;
    }
    .main-row {
      display: flex;
      width: 1200px;
      height: 470px;
    }
    .left-panel {
      width: 620px;
      flex-shrink: 0;
      padding: 52px 56px 44px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }
    .top-row {
      display: flex;
      align-items: center;
    }
    .badge {
      background: #e0f2ee;
      color: #1a6b5a;
      font-size: 15px;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .logo {
      height: 60px;
      object-fit: contain;
      margin-left: auto;
    }
    .headline {
      margin-top: 32px;
    }
    .patient-name {
      font-size: 96px;
      font-weight: 900;
      color: #0d1f3c;
      line-height: 1;
      display: block;
    }
    .tagline {
      font-size: 80px;
      font-weight: 900;
      color: #2a7c6f;
      line-height: 1.05;
      display: block;
    }
    .subtitle {
      margin-top: 16px;
      font-size: 19px;
      color: #555;
      line-height: 1.5;
    }
    .right-panel {
      flex: 1;
      overflow: hidden;
      background: #f0f4f3;
    }
    .right-panel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }
    .right-panel .placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #2a7c6f 0%, #4ab5a5 50%, #e0f2ee 100%);
    }
    .icons-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 160px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 56px;
      border-top: 1px solid #f0f0f0;
    }
    .icon-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .icon-circle {
      width: 72px;
      height: 72px;
      background: #e0f2ee;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-circle img {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }
    .icon-label {
      font-size: 15px;
      font-weight: 600;
      color: #333;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="main-row">
    <div class="left-panel">
      <div class="top-row">
        <span class="badge">📅 DÍA 0 – TU PLAN ESTÁ LISTO</span>
        <img class="logo" src="assets/logo-Araujo.jpeg" alt="Araújo" />
      </div>
      <div class="headline">
        <span class="patient-name" id="patient-name"></span>
        <span class="tagline">tu sonrisa<br>empieza aquí</span>
      </div>
      <p class="subtitle">Hemos preparado un plan de tratamiento personalizado para ti.</p>
    </div>
    <div class="right-panel" id="right-panel"></div>
  </div>

  <div class="icons-bar">
    <div class="icon-item">
      <div class="icon-circle"><img src="assets/icon-og-calendar.png" alt="" /></div>
      <span class="icon-label">Plan paso a paso</span>
    </div>
    <div class="icon-item">
      <div class="icon-circle"><img src="assets/icon-og-implant.png" alt="" /></div>
      <span class="icon-label">Tratamiento explicado</span>
    </div>
    <div class="icon-item">
      <div class="icon-circle"><img src="assets/icon-og-euro.png" alt="" /></div>
      <span class="icon-label">Coste desglosado</span>
    </div>
    <div class="icon-item">
      <div class="icon-circle"><img src="assets/icon-og-shield.png" alt="" /></div>
      <span class="icon-label">Resultados esperados</span>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    const firstName = patientData.patient.name.split(' ')[0];
    document.getElementById('patient-name').textContent = firstName;

    const rightPanel = document.getElementById('right-panel');
    if (patientData.patient.photo) {
      const img = document.createElement('img');
      img.src = patientData.patient.photo;
      img.alt = firstName;
      rightPanel.appendChild(img);
    } else {
      const div = document.createElement('div');
      div.className = 'placeholder';
      rightPanel.appendChild(div);
    }
  </script>
</body>
</html>
