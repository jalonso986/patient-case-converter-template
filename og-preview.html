<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      position: relative;
    }
    .main-row {
      display: flex;
      width: 1200px;
      height: 470px;
    }
    .left-panel {
      width: 640px;
      flex-shrink: 0;
      padding: 44px 52px 36px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }
    .top-row {
      display: flex;
      align-items: center;
    }
    .badge {
      background: #e0f2ee;
      color: #1a6b5a;
      font-size: 14px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 100px;
      white-space: nowrap;
    }
    #logo {
      height: 52px;
      object-fit: contain;
      margin-left: auto;
    }
    .headline {
      margin-top: 24px;
    }
    #patient-name {
      font-size: 80px;
      font-weight: 900;
      color: #0d1f3c;
      line-height: 1;
      display: block;
    }
    .tagline {
      font-size: 64px;
      font-weight: 900;
      color: #2a7c6f;
      line-height: 1.05;
      display: block;
    }
    .subtitle {
      margin-top: 14px;
      font-size: 18px;
      color: #666;
      line-height: 1.4;
    }
    .right-panel {
      flex: 1;
      overflow: hidden;
      background: #f0f4f3;
    }
    #patient-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: none;
    }
    #photo-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #e0f2ee, #c8e8e2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 100px;
      color: #2a7c6f;
      opacity: 0.3;
    }
    .icons-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 160px;
      background: #ffffff;
      border-top: 1px solid #efefef;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 80px;
    }
    .icon-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .icon-circle {
      width: 80px;
      height: 80px;
      background: #e0f2ee;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-circle img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }
    .icon-label {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      text-align: center;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div class="main-row">
    <div class="left-panel">
      <div class="top-row">
        <span class="badge">📅 DÍA 0 – TU PLAN ESTÁ LISTO</span>
        <img id="logo" src="" alt="Araújo" />
      </div>
      <div class="headline">
        <span id="patient-name"></span>
        <span class="tagline">tu sonrisa empieza aquí</span>
      </div>
      <p class="subtitle">Hemos preparado un plan de tratamiento personalizado para ti.</p>
    </div>
    <div class="right-panel">
      <img id="patient-photo" src="" alt="" />
      <div id="photo-placeholder">👤</div>
    </div>
  </div>

  <div class="icons-bar">
    <div class="icon-item">
      <div class="icon-circle"><img id="icon-calendar" src="" alt="" /></div>
      <span class="icon-label">Plan paso&#10;a paso</span>
    </div>
    <div class="icon-item">
      <div class="icon-circle"><img id="icon-implant" src="" alt="" /></div>
      <span class="icon-label">Tratamiento&#10;explicado</span>
    </div>
    <div class="icon-item">
      <div class="icon-circle"><img id="icon-euro" src="" alt="" /></div>
      <span class="icon-label">Coste&#10;desglosado</span>
    </div>
    <div class="icon-item">
      <div class="icon-circle"><img id="icon-shield" src="" alt="" /></div>
      <span class="icon-label">Resultados&#10;esperados</span>
    </div>
  </div>
</body>
</html>
